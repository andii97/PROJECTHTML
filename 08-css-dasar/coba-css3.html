<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba CSS - Selector dan Properties</title>
    <style>
      /* Selector */
      h1 {
        color: lightblue;
        font-size: 45px;
        text-align: center;
      }

      /* Properties */
      p {
        color: navy;
        font-size: 30px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 style="text-decoration: underline; font-style: italic">Hello World</h1>
    <p>
      CSS (Cascading Style Sheets) adalah bahasa yang digunakan untuk mendesain
      tampilan halaman web. Dengan
    </p>
    <p>
      CSS memungkinkan kita untuk mengatur warna, ukuran, tata letak, dan
      berbagai aspek visual lainnya dari elemen-elemen HTML
    </p>
  </body>
</html>
